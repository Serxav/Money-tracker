name: Mobile

on:
  pull_request:
    branches: [develop, main, "release/**", "desarrollo/**"]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  push:
    branches: [develop, main, "release/**", "desarrollo/**"]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npx expo-doctor
      - name: Generar bundles de Android e iOS
        run: npx expo export --platform android --platform ios --output-dir dist
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
