openapi: 3.1.0
info:
  title: Money Tracker API
  description: API REST del Money Tracker. Importes en unidades menores de la divisa.
  license:
    name: MIT
  version: v1
servers:
- url: /
security:
- bearer: []
paths:
  /v1/transactions/{id}:
    get:
      tags:
      - movement-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovementResponse"
    put:
      tags:
      - movement-controller
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovementResponse"
    delete:
      tags:
      - movement-controller
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /v1/transactions:
    get:
      tags:
      - movement-controller
      operationId: list
      parameters:
      - name: accountId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - INCOME
          - EXPENSE
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseMovementResponse"
    post:
      tags:
      - movement-controller
      operationId: create
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MovementResponse"
  /v1/categories:
    get:
      tags:
      - category-controller
      operationId: list_1
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - INCOME
          - EXPENSE
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseCategoryResponse"
    post:
      tags:
      - category-controller
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
  /v1/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/refresh:
    post:
      tags:
      - auth-controller
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/auth/logout:
    post:
      tags:
      - auth-controller
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "204":
          description: No Content
  /v1/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /v1/accounts:
    get:
      tags:
      - account-controller
      operationId: list_2
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAccountResponse"
    post:
      tags:
      - account-controller
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponse"
  /v1/me:
    get:
      tags:
      - me-controller
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    delete:
      tags:
      - me-controller
      operationId: delete_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMeRequest"
        required: true
      responses:
        "204":
          description: No Content
    patch:
      tags:
      - me-controller
      operationId: update_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /v1/categories/{id}:
    delete:
      tags:
      - category-controller
      operationId: delete_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
    patch:
      tags:
      - category-controller
      operationId: update_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
  /v1/accounts/{id}:
    get:
      tags:
      - account-controller
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponse"
    delete:
      tags:
      - account-controller
      operationId: delete_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
    patch:
      tags:
      - account-controller
      operationId: update_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponse"
  /v1/currencies:
    get:
      tags:
      - currency-controller
      operationId: list_3
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurrencyResponse"
components:
  schemas:
    MovementRequest:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - INCOME
          - EXPENSE
        amount:
          type: integer
          format: int64
          maximum: 1000000000000000
          minimum: 1
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - accountId
      - amount
      - categoryId
      - date
      - type
    MovementResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - INCOME
          - EXPENSE
        amount:
          type: integer
          format: int64
        currency:
          type: string
        date:
          type: string
          format: date
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 40
          minLength: 0
        type:
          type: string
          enum:
          - INCOME
          - EXPENSE
        icon:
          type: string
          pattern: "^[a-z0-9-]{1,40}$"
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
      required:
      - name
      - type
    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum:
          - INCOME
          - EXPENSE
        icon:
          type: string
        color:
          type: string
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 0
        baseCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
        locale:
          type: string
          pattern: ^(es|ca|en)$
      required:
      - email
      - password
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserResponse"
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        baseCurrency:
          type: string
        locale:
          type: string
        createdAt:
          type: string
          format: date-time
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - refreshToken
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - email
      - password
    CreateAccountRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
          minLength: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        initialBalance:
          type: integer
          format: int64
          maximum: 1000000000000000
          minimum: -1000000000000000
      required:
      - currency
      - name
    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
        fractionDigits:
          type: integer
          format: int32
        initialBalance:
          type: integer
          format: int64
        balance:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    UpdateMeRequest:
      type: object
      properties:
        baseCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
        locale:
          type: string
          pattern: ^(es|ca|en)$
    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 40
          minLength: 1
        icon:
          type: string
          pattern: "^[a-z0-9-]{1,40}$"
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
    UpdateAccountRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 60
          minLength: 1
        initialBalance:
          type: integer
          format: int64
          maximum: 1000000000000000
          minimum: -1000000000000000
    PageResponseMovementResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MovementResponse"
        page:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    CurrencyResponse:
      type: object
      properties:
        code:
          type: string
        fractionDigits:
          type: integer
          format: int32
        name:
          type: string
    PageResponseCategoryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CategoryResponse"
        page:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    PageResponseAccountResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountResponse"
        page:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    DeleteMeRequest:
      type: object
      properties:
        password:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - password
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
