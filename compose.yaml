# Infraestructura local de desarrollo (no usar en producción).
# Uso: cp .env.example .env && docker compose up -d   (o: podman compose up -d)
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: moneytracker
      POSTGRES_USER: ${DB_USER:-moneytracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d moneytracker"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
